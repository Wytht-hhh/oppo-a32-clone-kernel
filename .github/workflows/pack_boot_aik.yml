name: 临时方案三：使用 AIK 脚本打包

on:
  workflow_dispatch:
    inputs:
      kernel_type:
        description: '选择内核（需上传到 factory_boot）'
        required: true
        default: 'Image.gz'
        type: choice
        options:
          - Image.gz
          - Image.gz-ksu

env:
  GITHUB_REPO: Wytht-hhh/oppo-a32-clone-kernel

jobs:
  pack_aik:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装基础工具
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip cpio gzip file

    - name: 3. 下载并解压 AIK（从 Release）
      run: |
        echo "====== 📦 从 Release 下载完整版 AIK ======"
        AIK_URL="https://github.com/${{ env.GITHUB_REPO }}/releases/download/aik-v1.0/AIK-Linux-mirror-master.zip"
        wget -q "$AIK_URL" -O aik.zip
        if [ ! -s aik.zip ]; then
          echo "❌ AIK 下载失败，请确认 Release 里有名为 AIK-Linux-mirror-master.zip 的文件"
          exit 1
        fi
        unzip -q aik.zip -d aik_temp
        AIK_DIR=$(find aik_temp -name "unpackimg.sh" -type f -exec dirname {} \; | head -1)
        mv "$AIK_DIR" aik
        cd aik
        chmod +x unpackimg.sh repackimg.sh cleanimg.sh
        
        echo "====== 🔧 验证 AIK 工具 ======"
        file bin/unpackbootimg
        file bin/mkbootimg

    - name: 4. 下载原厂 boot.img
      run: |
        wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/c12--original-boot/boot.img" -O boot.img
        if [ ! -s boot.img ]; then echo "❌ boot.img 下载失败！"; exit 1; fi

    - name: 5. 严格校验内核文件（防呆机制）
      run: |
        KERNEL_FILE="factory_boot/${{ inputs.kernel_type }}"
        if [ ! -f "$KERNEL_FILE" ]; then
          echo "❌ 致命错误：找不到 ${{ inputs.kernel_type }}！"
          echo "当前 factory_boot 目录下文件："
          ls -lh factory_boot/
          exit 1
        fi
        SIZE=$(stat -c%s "$KERNEL_FILE")
        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ 文件异常（小于 1MB），可能损坏！"
          exit 1
        fi
        echo "✅ 校验通过，大小：$(du -h $KERNEL_FILE | cut -f1)"

    - name: 6. 使用 AIK 脚本打包（尝试）
      run: |
        echo "====== 🔧 解包原厂 boot.img（使用 AIK 脚本） ======"
        cd aik
        ./unpackimg.sh ../boot.img || { echo "❌ AIK 解包失败！"; exit 1; }

        echo "====== 🔄 替换内核 ======"
        cp "../factory_boot/${{ inputs.kernel_type }}" ./split_img/boot.img-kernel

        echo "====== 📦 重新打包（使用 AIK 脚本） ======"
        ./repackimg.sh || true
        
        if [ -f "image-new.img" ]; then
          mv image-new.img ../new-boot.img
          echo "✅ AIK 打包成功！"
        else
          echo "❌ AIK 打包失败（很可能是因为 cpio 版本问题），请查看日志。"
          exit 1
        fi

    - name: 7. 准备最终产物
      if: always()
      run: |
        mkdir -p ~/final_release
        if [ -f new-boot.img ]; then cp new-boot.img ~/final_release/; fi
        cp "factory_boot/${{ inputs.kernel_type }}" ~/final_release/ || true
        
        echo "========================================================" > ~/final_release/README.txt
        echo " 临时方案三：AIK 打包产物" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt
        echo "如果 new-boot.img 存在，说明 AIK 脚本在这个环境下可以工作。" >> ~/final_release/README.txt
        echo "如果该文件不存在，说明 AIK 脚本与云端环境存在兼容问题，请继续使用独立工具方案。" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt

        cd ~/final_release
        zip -r "A32-AIK-Test.zip" ./*
        echo "====== ✅ 输出: A32-AIK-Test.zip ======"

    - name: 8. 上传产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A32-AIK-Test-Kit
        path: ~/final_release/*.zip
