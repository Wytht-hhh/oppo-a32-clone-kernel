name: OPPO A32 Linux 内核与 Boot 镜像构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '请选择构建类型'
        required: true
        default: 'kernel_only'
        type: choice
        options:
          - kernel_only       # 仅编译内核，用于验证Droidspaces配置
          - boot_only         # 仅打包 Boot 镜像（需自己提供编译好的内核）
          - kernel_and_boot   # 一键编译内核并打包成刷入包（推荐）

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ================== 1. 拉取仓库代码 ==================
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    # ================== 2. 安装编译依赖 ==================
    - name: 2. 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev zip curl python3 device-tree-compiler libtinfo5
        sudo mkdir -p /lib/firmware

    # ================== 3. 编译内核 ==================
    - name: 3. 编译内核
      if: inputs.build_type == 'kernel_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "====== 🛠️ 写入 Droidspaces 必需的内核配置 ======"
        # 强制开启 User Namespace 等容器所需选项
        sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/g' config/phone.config
        echo "CONFIG_USER_NS=y" >> config/phone.config
        echo "CONFIG_PID_NS=y" >> config/phone.config
        echo "CONFIG_NET_NS=y" >> config/phone.config
        echo "CONFIG_UTS_NS=y" >> config/phone.config
        echo "CONFIG_IPC_NS=y" >> config/phone.config
        echo "CONFIG_MEMCG=y" >> config/phone.config
        echo "CONFIG_CGROUP_DEVICE=y" >> config/phone.config
        echo "CONFIG_DEVTMPFS=y" >> config/phone.config
        
        echo "====== 🔧 开始执行编译脚本 ======"
        cp config/phone.config .config
        chmod +x build_kernel.sh
        ./build_kernel.sh
        
        echo "====== ✅ 验证 Droidspaces 相关配置是否生效 ======"
        grep -E "CONFIG_USER_NS|CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS|CONFIG_SECCOMP|CONFIG_PID_NS|CONFIG_NET_NS" .config || echo "⚠️ 注意：未找到部分关键配置，请检查日志！"
        
        echo "====== 📁 提取编译产出的内核 ======"
        mkdir -p ~/compiled_kernel
        cp ./build/arch/arm64/boot/Image.gz ~/compiled_kernel/Image.gz
        echo "✅ 已成功提取 Image.gz，准备上传。"
        ls -lh ~/compiled_kernel/

    # ================== 4. 上传内核文件 ==================
    - name: 4. 上传内核文件
      if: inputs.build_type == 'kernel_only'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: ~/compiled_kernel/*

    # ================== 5. 打包 Boot 镜像 ==================
    - name: 5. 打包 Boot 镜像
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        echo "====== 📦 从 Release 下载 AIK 打包工具 ======"
        AIK_URL="https://github.com/Wytht-hhh/oppo-a32-clone-kernel/releases/download/AIK-Linux-mirror/AIK-Linux-mirror-master.zip"
        wget -q "$AIK_URL" -O aik.zip
        if [ $? -ne 0 ]; then
          echo "❌ AIK 下载失败，请检查 Release 中的链接是否正确！"
          exit 1
        fi
        unzip -q aik.zip -d aik_temp
        mv aik_temp/* aik 2>/dev/null || true
        cd aik
        
        echo "====== 🧐 从 Release 下载原厂 boot.img ======"
        mkdir -p ../factory_boot
        # 请将下面的 URL 替换为你 Release 中 boot.img 的实际下载链接
        BOOT_URL="https://github.com/Wytht-hhh/oppo-a32-clone-kernel/releases/download/c12--original-boot/boot.img"
        wget -q "$BOOT_URL" -O ../factory_boot/boot.img
        if [ $? -ne 0 ]; then
          echo "❌ boot.img 下载失败，请检查 Release 中的链接是否正确！"
          exit 1
        fi
        
        cp ../factory_boot/boot.img ./
        
        echo "====== 🔧 解包原厂 boot.img ======"
        ./unpackimg.sh boot.img
        
        echo "====== 🔄 替换内核 ======"
        if [ "${{ inputs.build_type }}" == "kernel_and_boot" ]; then
          echo "✅ 使用刚编译出的内核..."
          cp ~/compiled_kernel/Image.gz ./split_img/boot.img-kernel
        else
          echo "⚠️ boot_only 模式，请确保已将内核文件放在 factory_boot/boot.img-kernel"
          if [ ! -f "../factory_boot/boot.img-kernel" ]; then
            echo "❌ 错误：找不到 factory_boot/boot.img-kernel 文件！"
            exit 1
          fi
          cp ../factory_boot/boot.img-kernel ./split_img/
        fi
        
        echo "====== 📦 重新打包生成 Boot 镜像 ======"
        ./repackimg.sh
        
        mv image-new.img ../new-boot.img
        echo "✅ Boot 镜像打包成功！"

    # ================== 6. 上传 Boot 镜像 ==================
    - name: 6. 上传 Boot 镜像
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      uses: actions/upload-artifact@v4
      with:
        name: new-boot-image
        path: new-boot.img
