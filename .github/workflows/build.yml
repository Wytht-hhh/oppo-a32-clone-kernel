name: OPPO A32 内核与 Boot 镜像构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '请选择构建类型'
        required: true
        default: 'kernel_and_boot'
        type: choice
        options:
          - kernel_only       # 仅编译内核
          - boot_only         # 仅打包 Boot 镜像
          - kernel_and_boot   # 一键编译内核并打包（推荐）
      root_choice:
        description: '选择 Root 方案'
        required: true
        default: 'magisk'
        type: choice
        options:
          - magisk            # 自动修补 Magisk（如果失败，可手动修补）
          - kernelsu          # 编译时集成 KernelSU
          - none              # 不附带 Root 工具
      custom_boot_url:
        description: '【可选】原厂 boot.img 的外部下载直链（不填则自动从 Release 下载）'
        required: false
        default: ''
      custom_kernel_url:
        description: '【可选】已有内核 Image.gz 的外部下载直链（仅 boot_only 模式使用）'
        required: false
        default: ''

env:
  GITHUB_REPO: Wytht-hhh/oppo-a32-clone-kernel
  KERNEL_SOURCE_DIR: kernel/android_kernel_modules_and_devicetree_oppo_sm4250/source/android/kernel/msm-4.19

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ================== 1. 拉取仓库代码 ==================
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    # ================== 2. 安装编译依赖 ==================
    - name: 2. 安装编译依赖
      run: |
        export TERM=xterm
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev zip curl python3 device-tree-compiler libtinfo5 unzip cpio gzip wget
        sudo mkdir -p /lib/firmware
        echo "====== 依赖安装完成，当前 cpio 版本： ======"
        cpio --version

    # ================== 3. 编译内核 ==================
    - name: 3. 编译内核
      if: inputs.build_type == 'kernel_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # ============================================================
        # 🛠️ 写入 Droidspaces 必需的内核配置
        # ------------------------------------------------------------
        # Droidspaces 是基于 Linux 容器（LXC）技术实现的，它需要内核
        # 开启以下基础功能才能正常运行：
        #   CONFIG_USER_NS   - 用户命名空间，用于容器权限隔离
        #   CONFIG_PID_NS    - PID 命名空间，用于进程隔离
        #   CONFIG_NET_NS    - 网络命名空间，用于网络隔离
        #   CONFIG_UTS_NS    - UTS 命名空间，用于主机名隔离
        #   CONFIG_IPC_NS    - IPC 命名空间，用于进程间通信隔离
        #   CONFIG_MEMCG     - 内存控制组，用于容器资源限制
        #   CONFIG_CGROUP_DEVICE - 设备控制组，用于设备访问控制
        #   CONFIG_DEVTMPFS  - 设备文件系统，容器内需要 /dev 目录
        # ============================================================
        echo "====== 🛠️ 写入 Droidspaces 必需的内核配置 ======"
        sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/g' config/phone.config
        echo "CONFIG_USER_NS=y" >> config/phone.config
        echo "CONFIG_PID_NS=y" >> config/phone.config
        echo "CONFIG_NET_NS=y" >> config/phone.config
        echo "CONFIG_UTS_NS=y" >> config/phone.config
        echo "CONFIG_IPC_NS=y" >> config/phone.config
        echo "CONFIG_MEMCG=y" >> config/phone.config
        echo "CONFIG_CGROUP_DEVICE=y" >> config/phone.config
        echo "CONFIG_DEVTMPFS=y" >> config/phone.config

        # ============================================================
        # 🔧 集成 KernelSU（仅当用户选择 kernelsu 时）
        # ------------------------------------------------------------
        # KernelSU 的 setup.sh 必须在内核源码根目录运行，它会自动：
        #   1. 把 KernelSU 代码复制到 drivers/kernelsu/
        #   2. 修改内核的 Makefile 和 Kconfig 自动包含它
        # 所以我们要先 cd 进内核源码目录，集成完再回来。
        # ============================================================
        if [ "${{ inputs.root_choice }}" == "kernelsu" ]; then
          echo "====== 🔧 集成 KernelSU v0.9.5 到内核源码 ======"
          cd ${{ env.KERNEL_SOURCE_DIR }}
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          cd ${{ github.workspace }}
          echo "CONFIG_KSU=y" >> config/phone.config
          echo "CONFIG_KSU_DEBUG=n" >> config/phone.config
        fi

        echo "====== 🔧 开始执行编译脚本 ======"
        cp config/phone.config .config
        chmod +x build_kernel.sh
        ./build_kernel.sh

        echo "====== ✅ 验证 Droidspaces 相关配置 ======"
        grep -E "CONFIG_USER_NS|CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS|CONFIG_SECCOMP|CONFIG_PID_NS|CONFIG_NET_NS" .config

        if [ "${{ inputs.root_choice }}" == "kernelsu" ]; then
          echo "====== ✅ 验证 KernelSU 配置 ======"
          if grep -q "CONFIG_KSU=y" .config; then
            echo "✅ CONFIG_KSU=y 已生效，KernelSU 集成成功！"
          else
            echo "❌ 警告：CONFIG_KSU=y 未找到，KernelSU 可能集成失败！"
          fi
        fi

        echo "====== 📁 提取编译产出的内核 ======"
        mkdir -p ~/compiled_kernel
        cp ./build/arch/arm64/boot/Image.gz ~/compiled_kernel/Image.gz || { echo "❌ 未找到内核文件！"; exit 1; }
        ls -lh ~/compiled_kernel/

    # ================== 4. 上传编译好的内核 ==================
    - name: 4. 上传编译好的内核
      if: inputs.build_type == 'kernel_only'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: ~/compiled_kernel/*

    # ================== 5. 打包 Boot 镜像 ==================
    - name: 5. 打包 Boot 镜像
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        export TERM=xterm
        echo "====== 📦 准备 AIK 打包工具 ======"
        # 优先从 GitHub 官方仓库克隆（比从 Release 下载更稳定，避免命名和标签问题）
        git clone --depth=1 https://github.com/BuildVoid/AIK-Linux-mirror.git aik
        if [ ! -d "aik" ]; then
          echo "⚠️ 在线克隆 AIK 失败，尝试从 Release 下载..."
          AIK_URL="https://github.com/${{ env.GITHUB_REPO }}/releases/download/AIK-linux-mirror/AIK-linux-mirror.zip"
          wget -q "$AIK_URL" -O aik.zip
          if [ -s aik.zip ]; then
            unzip -q aik.zip -d aik_temp
            mv aik_temp/* aik 2>/dev/null || true
          fi
        fi
        if [ ! -d "aik" ] || [ ! -f "aik/unpackimg.sh" ]; then
          echo "❌ AIK 准备失败！请检查网络！"
          exit 1
        fi
        cd aik
        chmod +x unpackimg.sh repackimg.sh cleanimg.sh

        echo "====== 🧐 获取原厂 boot.img ======"
        # 优先使用用户自定义的直链下载
        if [ -n "${{ inputs.custom_boot_url }}" ]; then
          echo "检测到自定义下载链接，正在下载原厂 boot.img..."
          wget -q "${{ inputs.custom_boot_url }}" -O ../boot.img
        else
          echo "未提供自定义链接，尝试从 Release 下载..."
          BOOT_URL="https://github.com/${{ env.GITHUB_REPO }}/releases/download/c12--original-boot/boot.img"
          wget -q "$BOOT_URL" -O ../boot.img
        fi
        if [ ! -s ../boot.img ]; then
          echo "❌ 原厂 boot.img 下载失败！停止打包。"
          exit 1
        fi

        echo "====== 🔧 解包原厂 boot.img ======"
        ./unpackimg.sh ../boot.img || { echo "❌ 解包失败，请检查日志！"; exit 1; }

        echo "====== 🔄 替换内核 ======"
        if [ "${{ inputs.build_type }}" == "kernel_and_boot" ]; then
          cp ~/compiled_kernel/Image.gz ./split_img/boot.img-kernel
          echo "✅ 已使用刚编译出的内核替换。"
        else
          echo "⚠️ boot_only 模式，尝试获取用户提供的内核..."
          if [ -n "${{ inputs.custom_kernel_url }}" ]; then
            wget -q "${{ inputs.custom_kernel_url }}" -O ../custom_kernel.gz
            if [ -s ../custom_kernel.gz ]; then
              cp ../custom_kernel.gz ./split_img/boot.img-kernel
              echo "✅ 已使用自定义内核替换。"
            else
              echo "❌ 自定义内核下载失败！"
              exit 1
            fi
          else
            echo "❌ boot_only 模式需要你提供 factory_boot/boot.img-kernel 文件，或者填入 custom_kernel_url 链接！"
            exit 1
          fi
        fi

        echo "====== 📦 重新打包生成 Boot 镜像 ======"
        ./repackimg.sh || true

        # 检查生成的镜像文件，防止因环境问题导致文件名变化
        if [ -f "image-new.img" ]; then
            mv image-new.img ../new-boot.img
            echo "✅ Boot 镜像打包成功！"
        elif [ -f "boot.img" ]; then
            mv boot.img ../new-boot.img
            echo "✅ 发现重新打包的 boot.img，已重命名为 new-boot.img"
        else
            echo "❌ 打包失败：未找到生成的镜像文件！"
            echo "💡 排查建议：可能是 cpio 版本问题，或者 AIK 脚本执行权限不足，请检查日志。"
            exit 1
        fi

    # ================== 6. Magisk 自动修补 ==================
    - name: 6. Magisk 自动修补
      if: (inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot') && inputs.root_choice == 'magisk' && hashFiles('new-boot.img') != ''
      run: |
        echo "====== 📥 下载 Magisk APK ======"
        MAGISK_URL="https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/Magisk.apk"
        wget -q "$MAGISK_URL" -O Magisk.apk
        if [ ! -s Magisk.apk ]; then
          LATEST_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep "browser_download_url.*apk" | cut -d '"' -f 4)
          wget -q "$LATEST_URL" -O Magisk.apk
        fi

        if [ ! -s Magisk.apk ]; then
          echo "❌ Magisk 下载失败，跳过自动修补。请手动用 Magisk App 修补 new-boot.img"
          exit 0
        fi

        echo "====== 🔧 提取 Magisk 修补工具 ======"
        mkdir -p magisk_patch
        unzip -q Magisk.apk -d magisk_patch

        echo "====== 🩹 执行 Magisk 修补 ======"
        cd magisk_patch
        export MAGISK_VER=30.6
        export MAGISK_VER_CODE=30600
        PATCH_SCRIPT=$(find . -name "boot_patch.sh" | head -1)
        if [ -n "$PATCH_SCRIPT" ]; then
          cp ../new-boot.img ./boot.img
          chmod +x "$PATCH_SCRIPT"
          cd $(dirname "$PATCH_SCRIPT")
          sh boot_patch.sh ../boot.img || true
          cd ../..
          if [ -f "magisk_patched.img" ]; then
            cp magisk_patched.img ../new-boot-magisk-patched.img
            echo "✅ Magisk 自动修补成功！"
          fi
        else
          echo "⚠️ 未找到 boot_patch.sh，跳过自动修补。请手动用 Magisk App 修补。"
        fi

    # ================== 7. 准备最终产物 ==================
    - name: 7. 准备最终产物
      if: always() && (inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot')
      run: |
        ROOT_CHOICE="${{ inputs.root_choice }}"
        if [ "$ROOT_CHOICE" == "magisk" ]; then
          KIT_NAME="A32-Kit-Magisk"
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then
          KIT_NAME="A32-Kit-KernelSU"
        else
          KIT_NAME="A32-Kit-NoRoot"
        fi

        echo "====== 📦 构建最终产物: ${KIT_NAME}.zip ======"
        mkdir -p ~/final_release/boot
        mkdir -p ~/final_release/kernel
        mkdir -p ~/final_release/apk

        # 1. 放入内核（无论打包是否成功，只要编译出来就放进去）
        if [ -f ~/compiled_kernel/Image.gz ]; then cp ~/compiled_kernel/Image.gz ~/final_release/kernel/; fi
        
        # 2. 放入未修补的 boot 镜像（非常重要，这是你手动修补用的源文件）
        if [ -f new-boot.img ]; then cp new-boot.img ~/final_release/boot/boot-unpatched.img; fi
        
        # 3. 放入 Magisk 修补后的镜像（如果自动修补成功）
        if [ -f new-boot-magisk-patched.img ]; then cp new-boot-magisk-patched.img ~/final_release/boot/boot-magisk-patched.img; fi

        # 4. 放入对应的 APK
        if [ "$ROOT_CHOICE" == "magisk" ]; then
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/Magisk.apk" -O ~/final_release/apk/Magisk.apk || true
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/KernelSU.apk" -O ~/final_release/apk/KernelSU.apk || true
        fi
        wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/Droidspaces.apk" -O ~/final_release/apk/Droidspaces.apk || true

        # 5. 生成通用 README
        echo "========================================================" > ~/final_release/README.txt
        echo " OPPO A32 Kit 使用说明" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt
        echo "" >> ~/final_release/README.txt
        echo "本压缩包由 GitHub Actions 自动构建生成。" >> ~/final_release/README.txt
        echo "" >> ~/final_release/README.txt
        echo "【目录说明】" >> ~/final_release/README.txt
        echo "  boot/   - 存放 boot 镜像文件" >> ~/final_release/README.txt
        echo "  kernel/ - 存放编译好的内核文件" >> ~/final_release/README.txt
        echo "  apk/    - 存放需要用到的 APK 工具" >> ~/final_release/README.txt
        echo "" >> ~/final_release/README.txt
        echo "【刷入方法】" >> ~/final_release/README.txt
        echo "  1. 手机进入 Fastboot 模式（关机后按住音量减+电源键）" >> ~/final_release/README.txt
        echo "  2. 连接电脑，执行：fastboot flash boot boot/你要刷的镜像文件名" >> ~/final_release/README.txt
        echo "  3. 重启手机" >> ~/final_release/README.txt
        echo "" >> ~/final_release/README.txt

        if [ "$ROOT_CHOICE" == "magisk" ]; then
          echo "【Magisk 方案】" >> ~/final_release/README.txt
          echo "  刷 boot/boot-magisk-patched.img" >> ~/final_release/README.txt
          echo "  安装 apk/Magisk.apk 和 apk/Droidspaces.apk" >> ~/final_release/README.txt
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then
          echo "【KernelSU 方案】" >> ~/final_release/README.txt
          echo "  刷 boot/boot-unpatched.img" >> ~/final_release/README.txt
          echo "  安装 apk/KernelSU.apk 和 apk/Droidspaces.apk" >> ~/final_release/README.txt
        else
          echo "【无 Root 方案】" >> ~/final_release/README.txt
          echo "  刷 boot/boot-unpatched.img" >> ~/final_release/README.txt
          echo "  安装 apk/Droidspaces.apk" >> ~/final_release/README.txt
        fi

        echo "" >> ~/final_release/README.txt
        echo "【Droidspaces 使用教程】" >> ~/final_release/README.txt
        echo "  1. 安装 apk/Droidspaces.apk 并授予 Root 权限" >> ~/final_release/README.txt
        echo "  2. 在 App 内选择 Containers 从云端下载 Linux RootFS" >> ~/final_release/README.txt
        echo "  3. 下载完成后点击启动即可进入完整的 Linux 环境" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt

        cd ~/final_release
        if [ -z "$(ls -A ~/final_release)" ]; then
          echo "❌ final_release 目录为空，无法打包！"
          exit 1
        fi

        zip -r "${KIT_NAME}.zip" ./*
        echo "====== ✅ 最终产物打包完毕: ${KIT_NAME}.zip ======"
        ls -lh "${KIT_NAME}.zip"

    # ================== 8.上传最终产物 ==================
    - 名称: 8.上传最终产物
      if: always() && (inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot')
      uses: actions/upload-artifact@v4
      使用:
        名称: A32-Kit
        路径: ~/final_release/*.zip
