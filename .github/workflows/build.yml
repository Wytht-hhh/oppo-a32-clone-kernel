name: OPPO A32 Kernel Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建操作'
        required: true
        default: 'kernel_only'
        type: choice
        options:
          - kernel_only       # 仅编译内核
          - boot_only         # 仅构建 Boot 镜像（需要先跑过 kernel_only）
          - kernel_and_boot   # 编译内核 + 构建 Boot

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    # ================== 1. 拉取代码 ==================
    - name: Checkout code
      uses: actions/checkout@v4

    # ================== 2. 安装依赖（修复 libtinfo5） ==================
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev zip curl python3 device-tree-compiler libtinfo5
        sudo mkdir -p /lib/firmware

    # ================== 3. 编译内核（当选择 kernel_only 或 kernel_and_boot 时） ==================
    - name: Build Kernel
      if: inputs.build_type == 'kernel_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        cp config/phone.config .config
        chmod +x build_kernel.sh
        ./build_kernel.sh
        
        echo "====== 🔍 检查 Droidspaces 关键内核配置 ======"
        grep -E "CONFIG_USER_NS|CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS|CONFIG_SECCOMP" .config || echo "⚠️ 未找到 Droidspaces 配置，建议手动检查！"
        
        echo "====== 📁 搜索编译出的内核文件 ======"
        find . -name "Image*" -type f
        
        mkdir -p ~/compiled_kernel
        cp $(find . -name "Image.gz-dtb" -type f | head -n 1) ~/compiled_kernel/ 2>/dev/null || \
        cp $(find . -name "Image.gz" -type f | head -n 1) ~/compiled_kernel/ 2>/dev/null || \
        cp $(find . -name "Image" -type f | head -n 1) ~/compiled_kernel/ 2>/dev/null
        ls -lh ~/compiled_kernel/

    # ================== 4. 上传编译好的内核（仅 kernel_only 时） ==================
    - name: Upload Kernel Image
      if: inputs.build_type == 'kernel_only'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: ~/compiled_kernel/*

    # ================== 5. 构建 Boot 镜像（当选择 boot_only 或 kernel_and_boot 时） ==================
    - name: Pack Boot Image
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        # 下载 AIK 打包工具
        git clone https://github.com/BuildVoid/AIK-Linux-mirror.git aik
        cd aik
        
        # 复制原厂 boot.img（必须上传到仓库的 factory_boot 文件夹里）
        cp ../factory_boot/boot.img ./
        
        # 解包 boot.img
        ./unpackimg.sh boot.img
        
        # 替换内核
        # 如果是 kernel_and_boot，用刚编译好的；如果是 boot_only，用之前下载好的内核（需手动放到指定目录）
        if [ "${{ inputs.build_type }}" == "kernel_and_boot" ]; then
          cp ~/compiled_kernel/* ./split_img/boot.img-kernel
        else
          # boot_only 模式下，需要你提前把内核文件放在仓库的 factory_boot/ 目录下，或者用其他方式提供
          echo "⚠️ boot_only 模式下需要你预先提供内核文件，暂不支持自动处理。"
          exit 1
        fi
        
        # 重新打包
        ./repackimg.sh
        mv image-new.img ../new-boot.img

    # ================== 6. 上传打包好的 Boot 镜像（仅 boot_only 或 kernel_and_boot 时） ==================
    - name: Upload Boot Image
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      uses: actions/upload-artifact@v4
      with:
        name: new-boot-image
        path: new-boot.img
