name: OPPO A32 Kernel Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建操作'
        required: true
        default: 'kernel_only'
        type: choice
        options:
          - kernel_only       # 仅编译内核
          - boot_only         # 仅构建 Boot 镜像（需预置内核文件）
          - kernel_and_boot   # 编译内核 + 构建 Boot

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    # ================== 1. 拉取代码 ==================
    - name: Checkout code
      uses: actions/checkout@v4

    # ================== 2. 安装依赖 ==================
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev zip curl python3 device-tree-compiler libtinfo5
        sudo mkdir -p /lib/firmware

    # ================== 3. 编译内核（当选择 kernel_only 或 kernel_and_boot 时） ==================
    - name: Build Kernel
      if: inputs.build_type == 'kernel_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        cp config/phone.config .config
        chmod +x build_kernel.sh
        ./build_kernel.sh
        
        echo "====== 🔍 检查 Droidspaces 关键配置 ======"
        grep -E "CONFIG_USER_NS|CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_OVERLAY_FS" .config || echo "⚠️ 未找到关键配置，请手动检查！"
        
        echo "====== 📁 正在全盘搜索生成的内核文件 ======"
        find . -name "Image*" -type f 2>/dev/null
        
        mkdir -p ~/collected_kernel
        # 依次尝试寻找标准命名，确保一定会捕获到内核文件
        cp $(find . -name "Image.gz-dtb" -type f | head -n 1) ~/collected_kernel/ 2>/dev/null || \
        cp $(find . -name "Image.gz" -type f | head -n 1) ~/collected_kernel/ 2>/dev/null || \
        cp $(find . -name "Image" -type f | head -n 1) ~/collected_kernel/ 2>/dev/null
        
        echo "====== 📦 成功收集到的内核文件 ======"
        ls -lh ~/collected_kernel/

    # ================== 4. 上传编译好的内核（仅 kernel_only 时） ==================
    - name: Upload Kernel Image
      if: inputs.build_type == 'kernel_only'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: ~/collected_kernel/*

    # ================== 5. 构建 Boot 镜像（当选择 boot_only 或 kernel_and_boot 时） ==================
    - name: Pack Boot Image
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      run: |
        # 检查原厂 boot.img 是否存在
        if [ ! -f "factory_boot/boot.img" ]; then
          echo "❌ 错误：未找到 factory_boot/boot.img，请先上传纯净原厂镜像！"
          exit 1
        fi
        
        # 下载 AIK 打包工具
        git clone https://github.com/BuildVoid/AIK-Linux-mirror.git aik
        cd aik
        
        # 解包原厂 boot.img
        cp ../factory_boot/boot.img ./
        ./unpackimg.sh boot.img
        
        # 替换内核
        if [ "${{ inputs.build_type }}" == "kernel_and_boot" ]; then
          # 使用刚刚编译出来的内核
          cp ~/collected_kernel/* ./split_img/boot.img-kernel
        elif [ "${{ inputs.build_type }}" == "boot_only" ]; then
          # 使用预先存放在 factory_boot/ 目录下的内核文件
          if [ -f "../factory_boot/Image.gz-dtb" ]; then
            cp ../factory_boot/Image.gz-dtb ./split_img/boot.img-kernel
          elif [ -f "../factory_boot/Image.gz" ]; then
            cp ../factory_boot/Image.gz ./split_img/boot.img-kernel
          elif [ -f "../factory_boot/Image" ]; then
            cp ../factory_boot/Image ./split_img/boot.img-kernel
          else
            echo "❌ 错误：boot_only 模式下，请把内核文件（如 Image.gz-dtb）也放到 factory_boot/ 目录下！"
            exit 1
          fi
        fi
        
        # 重新打包
        ./repackimg.sh
        mv image-new.img ../new-boot.img

    # ================== 6. 上传打包好的 Boot 镜像（仅 boot_only 或 kernel_and_boot 时） ==================
    - name: Upload Boot Image
      if: inputs.build_type == 'boot_only' || inputs.build_type == 'kernel_and_boot'
      uses: actions/upload-artifact@v4
      with:
        name: new-boot-image
        path: new-boot.img
