name: 打包 Boot 镜像（已有内核）

on:
  workflow_dispatch:
    inputs:
      kernel_type:
        description: '选择内核文件（需上传到 factory_boot 文件夹）'
        required: true
        default: 'Image.gz'
        type: choice
        options:
          - Image.gz           # 纯 Droidspaces 内核
          - Image.gz-ksu       # Droidspaces + KernelSU 内核
      root_choice:
        description: '选择 Root 方案'
        required: true
        default: 'magisk'
        type: choice
        options:
          - magisk
          - kernelsu
          - none

env:
  GITHUB_REPO: Wytht-hhh/oppo-a32-clone-kernel

jobs:
  pack:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装基础工具
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip gzip file

    # ================== 3. 严格校验内核文件（修复假成功 Bug） ==================
    - name: 3. 严格校验内核文件
      run: |
        echo "====== 🔍 检查用户选择的内核: ${{ inputs.kernel_type }} ======"
        KERNEL_FILE="factory_boot/${{ inputs.kernel_type }}"

        if [ ! -f "$KERNEL_FILE" ]; then
          echo "❌ 致命错误：在 factory_boot 文件夹中未找到 ${{ inputs.kernel_type }}！"
          echo ""
          echo "当前 factory_boot 目录下的所有文件："
          ls -lh factory_boot/ || echo "（文件夹为空或不存在）"
          echo ""
          echo "请上传正确的内核文件，或重新运行并选择存在的内核。"
          exit 1
        fi

        SIZE=$(stat -c%s "$KERNEL_FILE")
        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ 致命错误：${{ inputs.kernel_type }} 文件大小异常（小于 1MB），可能损坏！"
          exit 1
        fi

        echo "✅ 内核文件存在，大小：$(du -h $KERNEL_FILE | cut -f1)"

        # 额外校验：检查内核是否真的包含 KernelSU 符号
        if file "$KERNEL_FILE" | grep -q "gzip compressed data"; then
          gzip -dc "$KERNEL_FILE" > /tmp/Image_check
        else
          cp "$KERNEL_FILE" /tmp/Image_check
        fi

        if strings /tmp/Image_check | grep -iq "kernelsu"; then
          IS_KSU="yes"
          echo "✅ 检测到 KernelSU 符号"
        else
          IS_KSU="no"
          echo "ℹ️ 未检测到 KernelSU 符号"
        fi

        # 防呆：防止用户选错
        if [ "${{ inputs.kernel_type }}" == "Image.gz-ksu" ] && [ "$IS_KSU" == "no" ]; then
          echo "❌ 错误：你选择了 KernelSU 内核，但文件里没有 KernelSU 符号！"
          echo "请确认你上传的 Image.gz-ksu 是否正确集成了 KernelSU。"
          exit 1
        fi
        if [ "${{ inputs.kernel_type }}" == "Image.gz" ] && [ "$IS_KSU" == "yes" ]; then
          echo "⚠️ 提示：你选择的 Image.gz 实际上包含 KernelSU 符号。"
          echo "如果你想要纯 Droidspaces 内核，请上传正确文件。"
          echo "现在将按你的选择（Image.gz）继续处理，但请注意实际效果。"
        fi

    - name: 4. 打包 Boot 镜像
      run: |
        cp tools/unpackbootimg ./unpackbootimg
        cp tools/mkbootimg ./mkbootimg
        chmod +x ./unpackbootimg ./mkbootimg

        wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/c12--original-boot/boot.img" -O boot.img
        if [ ! -s boot.img ]; then echo "❌ boot.img 下载失败！"; exit 1; fi

        mkdir -p bootimg_out
        ./unpackbootimg -i boot.img -o bootimg_out || { echo "❌ 解包失败！"; exit 1; }
        cp "factory_boot/${{ inputs.kernel_type }}" bootimg_out/boot.img-kernel

        cd bootimg_out
        CMDLINE=$(cat boot.img-cmdline); BASE=$(cat boot.img-base); PAGESIZE=$(cat boot.img-pagesize)
        KERNEL_OFFSET=$(cat boot.img-kernel_offset); RAMDISK_OFFSET=$(cat boot.img-ramdisk_offset)
        SECOND_OFFSET=$(cat boot.img-second_offset); TAGS_OFFSET=$(cat boot.img-tags_offset)
        DTB_OFFSET=$(cat boot.img-dtb_offset); OS_VERSION=$(cat boot.img-os_version)
        OS_PATCH_LEVEL=$(cat boot.img-os_patch_level); HEADER_VERSION=$(cat boot.img-header_version)

        RAMDISK_ARG=""; if [ -f "boot.img-ramdisk.gz" ]; then RAMDISK_ARG="--ramdisk boot.img-ramdisk.gz"; elif [ -f "boot.img-ramdisk" ]; then RAMDISK_ARG="--ramdisk boot.img-ramdisk"; fi
        DTB_ARG=""; if [ -f "boot.img-dtb" ]; then DTB_ARG="--dtb boot.img-dtb"; fi
        SECOND_ARG=""; if [ -f "boot.img-second" ]; then SECOND_ARG="--second boot.img-second"; fi

        ../mkbootimg --kernel boot.img-kernel $RAMDISK_ARG $SECOND_ARG $DTB_ARG \
                  --cmdline "$CMDLINE" --base $BASE --pagesize $PAGESIZE \
                  --kernel_offset $KERNEL_OFFSET --ramdisk_offset $RAMDISK_OFFSET \
                  --second_offset $SECOND_OFFSET --tags_offset $TAGS_OFFSET \
                  --dtb_offset $DTB_OFFSET --os_version $OS_VERSION \
                  --os_patch_level $OS_PATCH_LEVEL --header_version $HEADER_VERSION \
                  -o ../new-boot.img
        cd ..
        [ -f "new-boot.img" ] && echo "✅ 打包成功！" || { echo "❌ 打包失败！"; exit 1; }

    - name: 5. 准备最终产物
      if: always()
      run: |
        ROOT_CHOICE="${{ inputs.root_choice }}"
        if [ "$ROOT_CHOICE" == "magisk" ]; then KIT_NAME="A32-Kit-Magisk"
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then KIT_NAME="A32-Kit-KernelSU"
        else KIT_NAME="A32-Kit-NoRoot"; fi

        mkdir -p ~/final_release/boot ~/final_release/kernel ~/final_release/apk
        if [ -f new-boot.img ]; then cp new-boot.img ~/final_release/boot/boot-unpatched.img; fi
        cp "factory_boot/${{ inputs.kernel_type }}" ~/final_release/kernel/ || true

        if [ "$ROOT_CHOICE" == "magisk" ]; then
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/magisk-v31.0/Alpha_v31000.apk" -O ~/final_release/apk/Magisk.apk || true
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/kernelsu-v0.9.5/KernelSU.apk" -O ~/final_release/apk/KernelSU.apk || true
        fi
        wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/droidspaces-v6.6.0/Droidspaces-universal-v6.6.0-cff50fa.apk" -O ~/final_release/apk/Droidspaces.apk || true

        echo "========================================================" > ~/final_release/README.txt
        echo " OPPO A32 打包产物" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt
        echo "本包含打包好的 boot-unpatched.img 和对应的 APK 工具。" >> ~/final_release/README.txt
        echo "" >> ~/final_release/README.txt
        if [ "$ROOT_CHOICE" == "magisk" ]; then
          echo "【Magisk 方案】" >> ~/final_release/README.txt
          echo "  1. 安装 apk/Magisk.apk" >> ~/final_release/README.txt
          echo "  2. 用 Magisk 修补 boot-unpatched.img" >> ~/final_release/README.txt
          echo "  3. fastboot flash boot magisk_patched.img" >> ~/final_release/README.txt
        elif [ "$ROOT_CHOICE" == "kernelsu" ]; then
          echo "【KernelSU 方案】" >> ~/final_release/README.txt
          echo "  1. fastboot flash boot boot-unpatched.img" >> ~/final_release/README.txt
          echo "  2. 安装 apk/KernelSU.apk" >> ~/final_release/README.txt
        else
          echo "【无 Root 方案】" >> ~/final_release/README.txt
          echo "  1. fastboot flash boot boot-unpatched.img" >> ~/final_release/README.txt
        fi
        echo "  最后安装 apk/Droidspaces.apk 开始用 Linux" >> ~/final_release/README.txt
        echo "========================================================" >> ~/final_release/README.txt

        cd ~/final_release
        zip -r "${KIT_NAME}.zip" ./*
        echo "====== ✅ 打包完成: ${KIT_NAME}.zip ======"

    - name: 6. 上传最终产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kit
        path: ~/final_release/*.zip
